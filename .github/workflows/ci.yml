name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets a `perf` label run the performance job on a pull request.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Pushes to main run one at a time end to end (version -> build -> publish), so two quick pushes
# never race for the same CalVer number. Pull requests just cancel their own stale runs.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Speed notes (a pull request should be green in ~3 minutes):
# - lint and test run in parallel jobs, each with its own rust-cache;
# - only main saves caches (pull requests restore main's and skip the ~40 s upload);
# - the perf tests (`perf::`) are not part of `test`: they take over every test thread for minutes.
#   They run on every push to main, by hand, or on a pull request labelled `perf`;
# - the real-language-server matrix lives in lsp.yml and runs only when LSP code changes;
# - on a push the release builds start right away, in parallel with lint and test (the release
#   job still needs all of them green).
jobs:
  lint:
    name: Format, clippy and release build
    runs-on: ubuntu-latest
    # No apt step: the runner image has everything the build needs (onig compiles its bundled
    # copy, Wayland/xkbcommon are dlopened at run time, fontconfig is parsed in Rust, libclang
    # ships with the image), so CI keeps working when the Ubuntu archive is down.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Release binary size budget
        shell: bash
        run: |
          size=$(stat -c %s target/release/lumen-text)
          budget=$((30 * 1024 * 1024))
          echo "lumen-text release binary: $((size / 1024)) KiB (budget $((budget / 1024)) KiB)"
          [ "$size" -le "$budget" ] || { echo "binary size over budget" >&2; exit 1; }

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: "Test (perf tests run in their own job; the real-tsgo test skips itself when tsgo is absent)"
        run: "cargo test --release --locked -- --skip perf::"

  perf:
    name: Performance regression tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    # Shared runners are noisy: report, but never block a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the binary (the startup tests time the real executable)
        run: cargo build --release --locked
      - name: Run performance tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked perf -- --nocapture --test-threads=1 2>&1 | tee perf.log
          # Process-wide PSS needs a quiet process, so this one is #[ignore]d in the normal test run.
          cargo test --release --locked memory_budget -- --ignored --nocapture --test-threads=1 2>&1 | tee -a perf.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-log
          path: perf.log

  version:
    name: Compute version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute version (CalVer YYYY.M.D.N) and build matrix
        id: version
        shell: bash
        env:
          # Repository variable (Settings -> Variables): set to "true" to also build aarch64.
          # GitHub-hosted arm runners are not available to private repositories.
          ENABLE_ARM_BUILDS: ${{ vars.ENABLE_ARM_BUILDS }}
        run: |
          git fetch --tags --force
          prefix="$(date -u +%Y.%-m.%-d)"
          n=$(git tag -l "v${prefix}.*" | wc -l)
          version="${prefix}.$((n + 1))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"
          # Built on 22.04 so the binary only needs glibc 2.35 (Debian 12, Ubuntu 22.04+, Fedora, ...).
          # To add another OS later, add a sibling build job next to `build-linux` and list it in
          # the `release` job's `needs`; its artifacts are picked up by the `dist-*` pattern.
          matrix='[{"arch":"x86_64","runner":"ubuntu-22.04","experimental":false}'
          if [ "${ENABLE_ARM_BUILDS}" = "true" ]; then
            matrix="${matrix},{\"arch\":\"aarch64\",\"runner\":\"ubuntu-22.04-arm\",\"experimental\":false}"
          fi
          echo "matrix=${matrix}]" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build and package (linux-${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # No Ubuntu apt here either: rpmbuild and rsvg-convert come from a Debian container
    # (tools/ci-debian.sh), so a release never waits on the Ubuntu archive.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.arch }}
      - name: HugeIcons Pro masks (only when the maintainer's token is available)
        shell: bash
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: |
          # Secrets can't be tested in `if:`, so the env var is. Fork PRs have no secret: skip, and
          # the build uses the bundled Zed icons. The masks are generated into the git-ignored
          # assets/icons/hugeicons*/, embedded into the binary by build.rs, never uploaded.
          if [ -z "${HUGEICONS_TOKEN}" ]; then
            echo "HUGEICONS_TOKEN not set: building with the bundled icons"
            exit 0
          fi
          echo "::add-mask::${HUGEICONS_TOKEN}"
          tools/ci-debian.sh node:22-bookworm "librsvg2-bin python3" tools/setup-hugeicons.sh >/dev/null
          ls assets/icons/hugeicons | wc -l
      - name: Build release binary
        env:
          LUMEN_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release --locked
          got="$(target/release/lumen-text --version)"
          echo "$got"
          [ "$got" = "lumen-text ${VERSION}" ] || { echo "version stamp mismatch" >&2; exit 1; }
      - name: Package (tar.gz, deb, rpm, AppImage)
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/lumen-text
          mkdir -p dist
          packaging/tarball/build-tarball.sh "$bin" "$VERSION" "${{ matrix.arch }}" dist
          packaging/deb/build-deb.sh "$bin" "$VERSION" "${{ matrix.arch }}" dist
          tools/ci-debian.sh debian:bookworm-slim "rpm" \
            packaging/rpm/build-rpm.sh "$bin" "$VERSION" "${{ matrix.arch }}" dist
          packaging/appimage/build-appimage.sh "$bin" "$VERSION" "${{ matrix.arch }}" dist
          rm -rf dist/AppDir dist/appimagetool-*.AppImage
      - name: Package (Arch pkg.tar.zst in an archlinux container)
        if: matrix.arch == 'x86_64'
        run: |
          packaging/arch/build-arch.sh "dist/lumen-text-${VERSION}-linux-x86_64.tar.gz" "$VERSION" dist
      - name: Inspect packages
        run: |
          set -x
          ls -l dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | head -30
          # Licensed HugeIcons masks live inside the binary only, never as loose package files.
          ! dpkg-deb --contents dist/*.deb | grep -q hugeicons
          ! tar tzf dist/*-linux-*.tar.gz | grep -q hugeicons
          tools/ci-debian.sh debian:bookworm-slim "rpm" bash -c '
            set -ex
            ! rpm -qpl dist/*.rpm | grep -q hugeicons
            rpm -qp --info dist/*.rpm
            rpm -qpl dist/*.rpm | head -30
            rpm -qp --requires dist/*.rpm'
      - name: Smoke test the .deb (install and run --version)
        if: matrix.arch == 'x86_64'
        run: |
          # Its hard dependencies ship with the runner image: dpkg installs without touching the
          # network (the X11/Wayland Recommends are not needed for the headless check).
          sudo dpkg -i ./dist/lumen-text_*.deb
          lumen-text --version
          test -f /usr/share/lumen-text/assets/language-manifest.json
          # Headless render: proves fonts, assets lookup and the CPU renderer work from the installed layout.
          d="$(mktemp -d)"; echo hello > "$d/f.txt"
          HOME="$d" XDG_CONFIG_HOME="$d/c" XDG_STATE_HOME="$d/s" \
            timeout 60 lumen-text --size 600x300 --snap "$d/snap" --keys "wait:200;snap:a" "$d/f.txt"
          test -s "$d/snap/a.png"
          head -c 8 "$d/snap/a.png" | od -An -c | grep -q 'P   N   G'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build and package (windows-x86_64)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows
      - name: HugeIcons cache key (month, so new upstream icons arrive by themselves)
        id: hi
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: HugeIcons Pro masks, encrypted cache
        uses: actions/cache@v6
        with:
          path: .hugeicons.enc
          key: hugeicons-v1-${{ steps.hi.outputs.month }}-${{ hashFiles('tools/setup-hugeicons.sh', 'tools/hugeicons-to-svg.mjs', 'tools/gen-icons.py') }}
          enableCrossOsArchive: true
      - name: HugeIcons Pro masks (only when the maintainer's token is available)
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: tools/ci-hugeicons.sh .hugeicons.enc "choco install rsvg-convert -y --no-progress"
      - name: Build release binary
        env:
          LUMEN_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release --locked
          got="$(target/release/lumen-text.exe --version)"
          echo "$got"
          [ "$got" = "lumen-text ${VERSION}" ] || { echo "version stamp mismatch" >&2; exit 1; }
      - name: Package (zip)
        run: |
          mkdir -p dist
          packaging/windows/build-zip.sh target/release/lumen-text.exe "$VERSION" x86_64 dist
          ls -l dist
          ! unzip -l dist/*.zip 2>/dev/null | grep -q hugeicons || { echo "hugeicons leaked into the zip" >&2; exit 1; }
      - name: Smoke test (headless render from the unpacked zip)
        run: |
          d="$(mktemp -d)"
          unzip -q dist/lumen-text-*-windows-x86_64.zip -d "$d/pkg"
          echo hello > "$d/f.txt"
          HOME="$d" timeout 90 "$d"/pkg/lumen-text-*/lumen-text.exe --size 600x300 --snap "$d/snap" --keys "wait:200;snap:a" "$d/f.txt"
          test -s "$d/snap/a.png"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-x86_64
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build and package (macos-${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos-${{ matrix.arch }}
      - name: HugeIcons cache key (month, so new upstream icons arrive by themselves)
        id: hi
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: HugeIcons Pro masks, encrypted cache
        uses: actions/cache@v6
        with:
          path: .hugeicons.enc
          key: hugeicons-v1-${{ steps.hi.outputs.month }}-${{ hashFiles('tools/setup-hugeicons.sh', 'tools/hugeicons-to-svg.mjs', 'tools/gen-icons.py') }}
          enableCrossOsArchive: true
      - name: HugeIcons Pro masks (only when the maintainer's token is available)
        shell: bash
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: tools/ci-hugeicons.sh .hugeicons.enc "brew install librsvg"
      - name: Build release binary
        shell: bash
        env:
          LUMEN_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release --locked
          got="$(target/release/lumen-text --version)"
          echo "$got"
          [ "$got" = "lumen-text ${VERSION}" ] || { echo "version stamp mismatch" >&2; exit 1; }
      - name: Package (.app in a .dmg, ad-hoc signed)
        shell: bash
        run: |
          mkdir -p dist
          packaging/macos/build-app.sh target/release/lumen-text "$VERSION" "${{ matrix.arch }}" dist
          ls -l dist
      - name: Smoke test (mount the dmg, headless render from the bundle)
        shell: bash
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach dist/*.dmg -mountpoint "$mnt" -nobrowse -quiet
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Lumen Text.app/Contents/MacOS/lumen-text"
          ! find "$mnt/Lumen Text.app" -name '*hugeicons*' | grep -q . || { echo "hugeicons leaked into the app" >&2; exit 1; }
          "$app" --version
          d="$(mktemp -d)"; echo hello > "$d/f.txt"
          HOME="$d" "$app" --size 600x300 --snap "$d/snap" --keys "wait:200;snap:a" "$d/f.txt"
          test -s "$d/snap/a.png"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, lint, test, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only the updater's public key is needed here (to double-check the signatures we make).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/update_key.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Verify the expected files exist
        run: |
          ls -l dist
          for f in \
            "lumen-text-${VERSION}-linux-x86_64.tar.gz" \
            "lumen-text-${VERSION}-linux-x86_64.tar.gz.sha256" \
            "lumen-text_${VERSION}-1_amd64.deb" \
            "lumen-text-${VERSION}-1.x86_64.rpm" \
            "lumen-text-bin-${VERSION}-1-x86_64.pkg.tar.zst" \
            "lumen-text-${VERSION}-x86_64.AppImage" \
            "lumen-text-${VERSION}-windows-x86_64.zip" \
            "lumen-text-${VERSION}-windows-x86_64.zip.sha256" \
            "lumen-text-${VERSION}-macos-aarch64.dmg" \
            "lumen-text-${VERSION}-macos-aarch64.dmg.sha256" \
            "lumen-text-${VERSION}-macos-x86_64.dmg" \
            "lumen-text-${VERSION}-macos-x86_64.dmg.sha256"; do
            [ -f "dist/$f" ] || { echo "missing release file: $f" >&2; exit 1; }
          done
      - name: Sign the AppImage, tarballs, Windows zip and macOS dmgs (minisign) and write latest.json
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "${MINISIGN_SECRET_KEY}" ] || { echo "secret MINISIGN_SECRET_KEY is not set (see CONTRIBUTING.md, Releases)" >&2; exit 1; }
          # minisign from its official release (pinned and checksummed), not from the Ubuntu archive;
          # jq ships with the runner image.
          ms_tgz="${RUNNER_TEMP}/minisign.tgz"
          curl -fsSL --retry 3 -o "$ms_tgz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $ms_tgz" | sha256sum -c -
          tar -xzf "$ms_tgz" -C "${RUNNER_TEMP}" minisign-linux/x86_64/minisign
          export PATH="${RUNNER_TEMP}/minisign-linux/x86_64:$PATH"
          minisign -v
          key="${RUNNER_TEMP}/minisign.key"
          (umask 077; printf '%s\n' "${MINISIGN_SECRET_KEY}" > "$key")
          trap 'rm -f "$key"' EXIT
          # The trusted comment ties each signature to one version and one file name, so an old
          # (validly signed) file can't be replayed as a newer release.
          for f in dist/*.AppImage dist/*.tar.gz dist/*.zip dist/*.dmg; do
            name="$(basename "$f")"
            minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "lumen-text ${VERSION} ${name}"
            minisign -V -p src/update_key.pub -m "$f" -x "$f.minisig" >/dev/null   # must match the key embedded in the app
          done
          # Release notes: every commit since the previous release, newest first (a push to main is
          # one release, so this is the whole changelog). Written once, used for the GitHub release
          # and (first lines) for latest.json.
          prev="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || true)"
          {
            if [ -n "$prev" ] && commits="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA}" \
                --jq '.commits | reverse | map("- " + (.commit.message | split("\n")[0]) + " (`" + .sha[0:7] + "`)") | .[]')" \
                && [ -n "$commits" ]; then
              echo "## What changed ($(wc -l <<<"$commits") commits)"
              echo
              echo "$commits"
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...v${VERSION}"
            else
              echo "lumen-text ${VERSION}"
            fi
          } > release-notes.md
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          platforms='{}'
          add() { # add <platform key> <file name>: signed files carry their base64 .minisig, the rest an empty signature
            local key="$1" file="$2" sig=""
            [ -f "dist/$file" ] || return 0
            [ -f "dist/$file.minisig" ] && sig="$(base64 -w0 "dist/$file.minisig")"
            platforms="$(jq -c --arg k "$key" --arg u "${base}/$file" --arg s "$sig" '. + {($k): {url: $u, signature: $s}}' <<<"$platforms")"
          }
          for pair in "x86_64 amd64 x86_64" "aarch64 arm64 aarch64"; do
            set -- $pair; arch="$1"; deb="$2"; rpm="$3"
            add "linux-${arch}-appimage" "lumen-text-${VERSION}-${arch}.AppImage"
            add "linux-${arch}-tarball" "lumen-text-${VERSION}-linux-${arch}.tar.gz"
            add "linux-${arch}-deb" "lumen-text_${VERSION}-1_${deb}.deb"
            add "linux-${arch}-rpm" "lumen-text-${VERSION}-1.${rpm}.rpm"
            add "linux-${arch}-arch" "lumen-text-bin-${VERSION}-1-${arch}.pkg.tar.zst"
          done
          # Windows and macOS builds are announced by the updater (link to the release) but not applied by it.
          add "windows-x86_64-zip" "lumen-text-${VERSION}-windows-x86_64.zip"
          add "macos-aarch64-dmg" "lumen-text-${VERSION}-macos-aarch64.dmg"
          add "macos-x86_64-dmg" "lumen-text-${VERSION}-macos-x86_64.dmg"
          jq -n --arg v "${VERSION}" --arg n "$(head -n 40 release-notes.md)" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$platforms" '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > dist/latest.json
          jq -e '.platforms["linux-x86_64-appimage"].signature != "" and .platforms["linux-x86_64-tarball"].signature != ""' dist/latest.json >/dev/null
          cat dist/latest.json
      - name: Checksums for every file
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "lumen-text ${VERSION}" \
            --notes-file release-notes.md
