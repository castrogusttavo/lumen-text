name: ghp-lsp

# Standalone package in tools/ghp-lsp (not part of the editor's crate): only built when it changes.
on:
  push:
    branches: [main]
    paths: ["tools/ghp-lsp/**", ".github/workflows/ghp-lsp.yml"]
  pull_request:
    paths: ["tools/ghp-lsp/**", ".github/workflows/ghp-lsp.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ghp-lsp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ghp-lsp
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/ghp-lsp
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
