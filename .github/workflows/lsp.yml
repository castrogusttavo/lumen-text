name: Language servers

# Real language servers, end to end (src/lsp_matrix.rs). Slow (installs ~25 servers) and depends on
# upstream releases, so pull requests only run it when LSP code changes; main runs it on every push
# and once a week, so an upstream server that broke shows up even without a code change.
# Never a dependency of the release: a red job says which language stopped working.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/lsp*"
      - "src/app_lsp*"
      - "src/inlay.rs"
      - "src/eslint.rs"
      - "src/format.rs"
      - "tools/install-lsp-servers.sh"
      - "Cargo.lock"
      - ".github/workflows/lsp.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: lsp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lsp:
    name: Language servers (real, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: clangd for C/C++ (official standalone release, pinned and checksummed - no apt)
        run: |
          v=23.1.0
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/clangd.zip" "https://github.com/clangd/clangd/releases/download/${v}/clangd-linux-${v}.zip"
          echo "e53b1a96196095faedb7642cf64964f7fb9ad4a0c1f00dd2c172a3d9dcbafdfd  ${RUNNER_TEMP}/clangd.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/clangd.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/clangd_${v}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Toolchains the servers run on (or need to analyse their language).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25   # current jdtls snapshots need Java 25 (their launcher still says 21)
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
      - name: Install the language servers (pinned versions)
        run: tools/install-lsp-servers.sh
      - name: Versions
        run: |
          php --version | head -1; java -version 2>&1 | head -1; dotnet --version; go version
          ruby --version; node --version; clangd --version | head -1
      - name: LSP matrix (every language - server starts, diagnostics, hover, completion)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked lsp_matrix -- --ignored --nocapture --test-threads=1 2>&1 | tee lsp-matrix.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          [ -f lsp-matrix.log ] || exit 0
          { echo '```'; sed -n '/===== LSP matrix =====/,/^$/p' lsp-matrix.log | tail -n +2; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lsp-matrix-log
          path: lsp-matrix.log
