name: packaging

# Dry run of the release packaging, on pull requests. The release jobs in ci.yml only run on a push to
# main, so without this the first release would be the first time the packaging scripts run.
# Here the real packaging scripts wrap a tiny stand-in for the editor binary on each OS/arch a PR host
# can run (the editor itself is built and smoke-tested by ci.yml); the Windows job builds the real exe.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "src/update.rs"
      - "src/app_update.rs"
      - "src/update_key.pub"
      - "tools/ci-debian.sh"
      - ".github/actions/**"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Any CalVer-shaped number: the scripts only check the format.
  VERSION: "2099.1.1"

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux packages (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Package (tar.gz, deb, rpm, AppDir, Arch)
        run: |
          set -euo pipefail
          mkdir -p dist
          printf 'int main(void){return 0;}' | cc -x c -o dist/standin-editor -
          bin=dist/standin-editor
          packaging/tarball/build-tarball.sh "$bin" "$VERSION" x86_64 dist
          packaging/deb/build-deb.sh "$bin" "$VERSION" x86_64 dist
          tools/ci-debian.sh debian:bookworm-slim "rpm" packaging/rpm/build-rpm.sh "$bin" "$VERSION" x86_64 dist
          # Only the AppDir (appimagetool is a download; the layout is what matters here).
          LUMEN_NO_APPIMAGETOOL=1 packaging/appimage/build-appimage.sh "$bin" "$VERSION" x86_64 dist
          packaging/arch/build-arch.sh "dist/lumen-text-${VERSION}-linux-x86_64.tar.gz" "$VERSION" dist
      - name: Every package carries the editor
        run: |
          set -euo pipefail
          ls -l dist
          dpkg-deb --contents dist/*.deb | grep '/usr/bin/lumen-text$' >/dev/null
          tar tzf dist/*-linux-*.tar.gz | grep '/bin/lumen-text$' >/dev/null
          tar -I zstd -tf dist/*.pkg.tar.zst | grep '^usr/bin/lumen-text$' >/dev/null
          test -x dist/AppDir/usr/bin/lumen-text
          tools/ci-debian.sh debian:bookworm-slim "rpm" bash -c '
            set -ex
            rpm -qpl dist/*.rpm | grep -q "^/usr/bin/lumen-text$"'

  windows-installer:
    name: Windows installer and in-app update (real exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Four numbers like a real release: the updater test needs "next version" to be a CalVer.
      E2E_VERSION: "2099.1.1.1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: packaging-windows-installer
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Git defaults for the tests (no CRLF conversion on Windows)
        run: git config --global core.autocrlf false
      - name: Build lumen-text.exe (stamped with a CalVer version)
        env:
          LUMEN_VERSION: ${{ env.E2E_VERSION }}
        run: |
          cargo build --release --locked
          got="$(target/release/lumen-text.exe --version | tr -d '\r')"
          [ "$got" = "lumen-text ${E2E_VERSION}" ] || { echo "version stamp mismatch: $got" >&2; exit 1; }
          ! grep -qa 'VCRUNTIME140' target/release/lumen-text.exe || { echo "lumen-text.exe imports VCRUNTIME140.dll: crt-static is not in effect" >&2; exit 1; }
      - name: Updater unit tests on Windows
        run: "cargo test --release --locked update::"
      - uses: ./.github/actions/setup-innosetup
      - name: Package (zip and installer)
        run: |
          mkdir -p dist
          packaging/windows/build-zip.sh target/release/lumen-text.exe "$E2E_VERSION" x86_64 dist
          packaging/windows/build-setup.sh target/release/lumen-text.exe "$E2E_VERSION" x86_64 dist
          ls -l dist
          unzip -l dist/*.zip | grep 'lumen-text.exe' >/dev/null
      - name: Installer test (silent install, upgrade, uninstall)
        shell: pwsh
        run: packaging/windows/test-installer.ps1 -Setup "dist/lumen-text-$env:E2E_VERSION-windows-x86_64-setup.exe" -Version "$env:E2E_VERSION" -ExpectVersionOutput "lumen-text $env:E2E_VERSION"
      - name: Updater test (install, serve a signed next version, update in place)
        run: packaging/windows/test-update.sh "dist/lumen-text-${E2E_VERSION}-windows-x86_64-setup.exe" target/release/lumen-text.exe "$E2E_VERSION"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer-dry-run
          path: dist/
          retention-days: 3

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
      - name: Package (.app in a .dmg, ad-hoc signed)
        shell: bash
        run: |
          mkdir -p dist
          printf 'int main(void){return 0;}' | cc -x c -o dist/standin-editor -
          # The binary must be the architecture of its runner (the app is not universal).
          file dist/standin-editor | grep "${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}" >/dev/null
          packaging/macos/build-app.sh dist/standin-editor "$VERSION" "${{ matrix.arch }}" dist
          mnt="$(mktemp -d)"
          hdiutil attach dist/*.dmg -mountpoint "$mnt" -nobrowse -quiet
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          test -x "$mnt/Lumen Text.app/Contents/MacOS/lumen-text"
          codesign --verify --deep --strict "$mnt/Lumen Text.app"
