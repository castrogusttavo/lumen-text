name: GHP in the editor

# Lumen's side of GHP support: the `ghp` TextMate grammar, language registration, editing rules and
# the ghp-lsp wiring (src/lsp_matrix.rs `lsp_ghp`: the editor starts the real server for a broken
# .ghp and shows its diagnostics). The server is the standalone package in tools/ghp-lsp; until its
# binary (src/main.rs) is in the tree the end-to-end test skips itself.
on:
  push:
    branches: [main]
    paths:
      - "assets/grammars/ghp.json"
      - "assets/language-manifest.json"
      - "src/lsp*"
      - "src/editor.rs"
      - "src/highlight.rs"
      - "src/textmate.rs"
      - "tools/ghp-lsp/**"
      - ".github/workflows/ghp-editor.yml"
  pull_request:
    paths:
      - "assets/grammars/ghp.json"
      - "assets/language-manifest.json"
      - "src/lsp*"
      - "src/editor.rs"
      - "src/highlight.rs"
      - "src/textmate.rs"
      - "tools/ghp-lsp/**"
      - ".github/workflows/ghp-editor.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ghp-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Highlighting, editing rules and ghp-lsp end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            tools/ghp-lsp
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install golang.org/x/tools/gopls@v0.24.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Unit tests (grammar goldens, GHP editing rules, registry)
        run: cargo test --release --locked ghp
      - name: Build ghp-lsp
        id: server
        run: |
          if [ -f tools/ghp-lsp/src/main.rs ]; then
            cargo build --release --manifest-path tools/ghp-lsp/Cargo.toml
            echo "$PWD/tools/ghp-lsp/target/release" >> "$GITHUB_PATH"
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::tools/ghp-lsp has no binary yet: the end-to-end test is skipped"
          fi
      - name: Lumen starts ghp-lsp and shows diagnostics for a broken .ghp
        env:
          LUMEN_REQUIRE_GHP_LSP: ${{ steps.server.outputs.present }}
        run: cargo test --release --locked lsp_ghp -- --ignored --nocapture --test-threads=1
