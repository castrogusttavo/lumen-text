name: GHP in the editor

# Lumen's side of GHP support: the `ghp` TextMate grammar, language registration, editing rules and
# the ghp-lsp wiring (src/lsp_matrix.rs `lsp_ghp`: the editor starts the real server for a broken
# .ghp and shows its diagnostics). ghp-lsp is its own project (github.com/GHP-GoLang-Framework/ghp-lsp):
# the test runs against the pinned released binary, like any other language server in the matrix.
on:
  push:
    branches: [main]
    paths:
      - "assets/grammars/ghp.json"
      - "assets/language-manifest.json"
      - "src/lsp*"
      - "src/editor.rs"
      - "src/highlight.rs"
      - "src/textmate.rs"
      - ".github/workflows/ghp-editor.yml"
  pull_request:
    paths:
      - "assets/grammars/ghp.json"
      - "assets/language-manifest.json"
      - "src/lsp*"
      - "src/editor.rs"
      - "src/highlight.rs"
      - "src/textmate.rs"
      - ".github/workflows/ghp-editor.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The released ghp-lsp the end-to-end test talks to (bump deliberately).
  GHP_LSP_VERSION: v0.1.0

concurrency:
  group: ghp-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Highlighting, editing rules and ghp-lsp end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install golang.org/x/tools/gopls@v0.24.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Unit tests (grammar goldens, GHP editing rules, registry)
        run: cargo test --release --locked ghp
      - name: Install the released ghp-lsp (pinned, checked against SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          asset="ghp-lsp-${GHP_LSP_VERSION}-${target}.tar.gz"
          d="$(mktemp -d)"
          gh release download "$GHP_LSP_VERSION" -R GHP-GoLang-Framework/ghp-lsp -D "$d" -p "$asset" -p SHA256SUMS
          (cd "$d" && grep " \*\?${asset}\$" SHA256SUMS | sha256sum -c -)
          mkdir -p "$d/x" "$HOME/.local/share/lumen-text/lsp/bin"
          tar xzf "$d/$asset" -C "$d/x"
          bin="$(find "$d/x" -type f -name ghp-lsp | head -n1)"
          test -n "$bin"
          install -m755 "$bin" "$HOME/.local/share/lumen-text/lsp/bin/ghp-lsp"
          echo "$HOME/.local/share/lumen-text/lsp/bin" >> "$GITHUB_PATH"
      - name: Lumen starts ghp-lsp and shows diagnostics for a broken .ghp
        env:
          LUMEN_REQUIRE_GHP_LSP: "1"
        run: cargo test --release --locked lsp_ghp -- --ignored --nocapture --test-threads=1
