name: Platforms

# Builds and tests on every supported OS/arch. Runs on pushes to the `platforms` branch and by hand;
# the regular CI workflow keeps handling main and pull requests.
on:
  push:
    branches: [platforms]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-latest }
          - { name: macos-arm64, runner: macos-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
    steps:
      # Linux: no apt step (the runner image has what the build needs; rpmbuild runs in a Debian
      # container), so this keeps working when the Ubuntu archive is down.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platforms-${{ matrix.name }}
      - name: Format and clippy (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --release --locked -- -D warnings
      - name: Git defaults for the tests (no CRLF conversion on Windows)
        run: git config --global core.autocrlf false
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Package (tar.gz, deb, rpm, AppImage) and smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=2026.1.1.1
          arch="$(uname -m)"
          bin=target/release/lumen-text
          mkdir -p dist
          packaging/tarball/build-tarball.sh "$bin" "$VERSION" "$arch" dist
          packaging/deb/build-deb.sh "$bin" "$VERSION" "$arch" dist
          tools/ci-debian.sh debian:bookworm-slim "rpm" packaging/rpm/build-rpm.sh "$bin" "$VERSION" "$arch" dist
          packaging/appimage/build-appimage.sh "$bin" "$VERSION" "$arch" dist
          ls -l dist
          sudo apt-get install -y --no-download --no-install-recommends ./dist/lumen-text_*.deb
          lumen-text --version
          d="$(mktemp -d)"; echo hello > "$d/f.txt"
          HOME="$d" XDG_CONFIG_HOME="$d/c" XDG_STATE_HOME="$d/s" \
            timeout 60 lumen-text --size 600x300 --snap "$d/snap" --keys "wait:200;snap:a" "$d/f.txt"
          test -s "$d/snap/a.png"
      - name: Package and smoke test (Windows zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          packaging/windows/build-zip.sh target/release/lumen-text.exe 2026.1.1.1 x86_64 dist
          ls -l dist
          d="$(mktemp -d)"
          unzip -q dist/lumen-text-*-windows-x86_64.zip -d "$d/pkg"
          echo hello > "$d/f.txt"
          HOME="$d" timeout 90 "$d"/pkg/lumen-text-*/lumen-text.exe --size 600x300 --snap "$d/snap" --keys "wait:200;snap:a" "$d/f.txt"
          test -s "$d/snap/a.png"
      - name: Package and smoke test (macOS app + dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="$(uname -m)"; [ "$arch" = arm64 ] && arch=aarch64
          packaging/macos/build-app.sh target/release/lumen-text 2026.1.1.1 "$arch" dist
          ls -l dist
          mnt="$(mktemp -d)"
          hdiutil attach dist/*.dmg -mountpoint "$mnt" -nobrowse -quiet
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Lumen Text.app/Contents/MacOS/lumen-text"
          "$app" --version
          d="$(mktemp -d)"; echo hello > "$d/f.txt"
          HOME="$d" "$app" --size 600x300 --snap "$d/snap" --keys "wait:200;snap:a" "$d/f.txt"
          test -s "$d/snap/a.png"
