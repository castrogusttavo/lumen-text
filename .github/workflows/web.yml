name: Web

# Builds and deploys the landing page + docs in web/ to GitHub Pages.
# Custom domain later: set the repository variable SITE_URL (for example https://lumen.example.com)
# and BASE_PATH to / ; nothing else changes.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml", "src/keymap.rs", "src/app_overlay/**", "src/settingsui/**", "src/config.rs"]
  # Pull requests only build (no deploy), so stale generated docs data or a broken page shows up before the merge.
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml", "src/keymap.rs", "src/app_overlay/**", "src/settingsui/**", "src/config.rs", "src/settings_ext.rs"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # actions/configure-pages
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://castrogusttavo.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/lumen-text' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Docs data must match the Rust sources
        run: |
          pnpm run extract
          git diff --exit-code -- src/data/keymap.json src/data/commands.json src/data/settings.json src/data/themes.json
      # Fails when src/data/benchmarks.json still has placeholders (see web/README.md).
      - run: pnpm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
