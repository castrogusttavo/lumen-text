[package]
name = "lumen-text"
version = "2026.11.9"
edition = "2024"
description = "Lightweight code editor in Rust with TextMate highlighting and a TypeScript workflow"
license = "MIT"
repository = "https://github.com/castrogusttavo/lumen-text"
homepage = "https://github.com/castrogusttavo/lumen-text"
readme = "README.md"
authors = ["Gustavo Leandro <castrogusttavo>"]
keywords = ["editor", "text-editor", "typescript", "wayland"]
categories = ["text-editors"]
publish = false

[build-dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false }
portable-pty = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
cosmic-text = "0.19.0"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image-webp = "0.2.4"
minisign-verify = "0.3.0"
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
ignore = "0.4.34"
onig = "6.5.3"
png = { version = "0.18.1", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.1"
roxmltree = "0.21.2"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
softbuffer = "0.4.8"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout"] }
unicode-width = "0.2.2"
vte = "0.15.0"
winit = "0.30.13"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
