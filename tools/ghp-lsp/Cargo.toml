[package]
name = "ghp-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for GHP (.ghp) templates: error-tolerant parser, diagnostics and position mapping"
publish = false

# Standalone package: deliberately not a member of the editor's root package.
[workspace]

[lib]
name = "ghp_lsp"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
